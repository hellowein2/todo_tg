services:
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: project-base:latest
    container_name: base

  pre-build:
    build: ./pre-build
    container_name: pre-build
    volumes:
      - ./ignore:/ignore

  main_bot:
    build:
      context: .
      dockerfile: main_bot/Dockerfile
    container_name: main_bot
    env_file:
      - .env


  web:
    build: ./app
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt/live/serega-sosi.ru:/etc/letsencrypt/live/serega-sosi.ru:ro
      - /etc/letsencrypt/archive/serega-sosi.ru:/etc/letsencrypt/archive/serega-sosi.ru:ro
      - /etc/letsencrypt/renewal:/etc/letsencrypt/renewal:ro
    depends_on:
      - web
